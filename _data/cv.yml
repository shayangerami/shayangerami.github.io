    Projects:
      - name: "ReVisiT: Efficient Video Vision Transformers"
        summary: Manuscript under review
        highlights:
          - Developed training-free selective inference using luminance-based change detection, one-hop spatial expansion,
            and temporal activation caching to recompute selected tokens across video frames.
          - Evaluated ViTDet-B on ImageNet VID, achieving 82.27% mAP@0.5 versus 82.37% for dense inference while reducing
            estimated backbone operations by 69.3%.
          - Evaluated ViTPose-S/16 on Sub-JHMDB, achieving 95.77% PCK@0.2 versus 95.75% for dense inference with 64.6% fewer
            estimated backbone operations.
          - Integrated selective DINO ViT-S/16 inference into video object segmentation on DAVIS 2017, achieving 60.64% J&F
            versus 61.8% for dense inference with 33.8% fewer estimated backbone operations.
          - Adapted Eventful Transformers and STC-Cacher for pose and segmentation and MaskVD for segmentation. Conducted ablations
            on spatial expansion, periodic refresh, and attention update strategies to characterize accuracy–computation tradeoffs.

      - name: "MGC: Missed-Guidance Correction for Diffusion and Flow Models"
        summary: Manuscript under review
        highlights:
          - Developed a training-free method for adapting diffusion and flow samplers to conditions arriving mid-generation.
            Estimated missed guidance from two to five historical probes and applied a single correction at the switch.
          - Investigated how historical guidance contributes target-specific information beyond the condition difference at the switch,
            and showed that successful semantic correction can occur without recovering the restart state.
          - Increased concept insertion success from 19.6% to 49.7% on Stable Diffusion 2.1 and from 41.4% to 71.0% on SD3.5 using
            two probes, averaged across switch times on restart-valid prompt pairs. Required 8% more model evaluations than direct
            switching and outperformed equal-compute rewinding by 26.1 percentage points on SD2.1.
          - Extended MGC to audio-visual speech enhancement with delayed lip-video conditioning, recovering 86.1% of the full audio-visual
            SI-SDR gain versus 49.4% for direct switching on the held-out speaker, and 72.9% versus 28.7% on unseen speakers and noise types.

      - name: "SCENE: Sparse Video Reconstruction for Efficient Object Detection"
        summary: Manuscript under review
        highlights:
          - Built the system-level evaluation for a sparse event-driven in/near-sensor engine that reconstructs conventional video
            frames from selected changes for frame-based object detection.
          - Evaluated reconstruction on 30,402 ImageNet-VidVRD frames across 107 videos. Compared against full-frame processing,
            running-average background modeling, and ViBe.
          - Swept comparison thresholds, resolutions, and periodic full-frame refresh schedules, measuring image fidelity,
            modeled data transfer, and detector accuracy.
          - Integrated YOLOV++ inference and fine-tuning on reconstructed frames. Identified one configuration reaching 83% mAP@0.5
            with 56% lower modeled transfer and another reaching 82% mAP@0.5 at 0.80 versus 2.76 MB/frame modeled transfer.

      - name: Heatmap-Guided LBPNet for Efficient Visual Recognition
        date: 2025-12
        url: https://github.com/shayangerami/HeatMapLBPNET
        summary: Journal publication (IEEE JETCAS)
        highlights:
          - Introduced heatmap-guided spatial masking and adaptive sampling to optimize MAC-free LBPNet architecture,
            reducing wasted processing on background regions.
          - Reduced operations by more than 10× and model size by more than 100× compared to CNN baselines on structured vision tasks.
          - Achieved approximately 99% on digit and character recognition and 95% on facial-expression recognition.

      - name: "SunSift: Battery-Free Computer Vision for Edge Devices"
        date: 2025-07
        url: https://github.com/shayangerami/SunSift
        summary: Conference publication (IEEE ACSOS 2025)
        highlights:
          - Built a battery-free vision pipeline that selects informative samples and deploys lightweight CNN inference on
            microcontrollers using TensorFlow Lite Micro.
          - Converted the PyTorch-trained sampler through ONNX and TensorFlow Lite for microcontroller deployment.
          - Designed selective MRAM checkpointing and implemented a six-state voltage-aware controller for sensing, computing,
            loading, storing, sleeping, and transmitting.

      - name: "ROAST: Reverse-training Offset Attack on Spatial Sampling Topologies"
        date: 2026
        summary: ACM/IEEE DAC, Late Breaking Results
        highlights:
          - Developed a white-box attack on LBPNet that maximizes classification loss by updating learned spatial sampling offsets,
            then uses truncated Hamming distance on FP32 representations to construct a bit-flip schedule.
          - Evaluated independent and cumulative attacks on MNIST and SVHN, reducing accuracy by 69.52 and 64.42 percentage points
            while flipping only 4.39% and 4.52% of offset bits, respectively. Achieved greater accuracy degradation per flipped bit than BFA.

      - name: "SENTRY: Selective Inference for Event-Driven Edge Vision"
        date: 2026
        summary: ACM GLSVLSI
        highlights:
          - Developed hierarchical event filtering using regional spike-rate gating and spatial confirmation to trigger selective
            vision inference. On an evaluated surveillance sequence, improved transmission precision from 41% to 67% and reduced
            false-positive transmissions from 65 to 28 versus a global spike-rate baseline.

      - name: "CloudAlign: 3D Point-Cloud Registration"
        summary: Independent project
        highlights:
          - Built an Open3D pipeline combining FPFH descriptors, RANSAC alignment, and ICP refinement, improving pose-recovery
            success over ICP alone from 69% to 99% across 100 test pairs and from 15% to 97% under large rotations,
            with 0.151 s median CPU runtime.

      - name: Evidence-Aware RAG Agent and Evaluation Framework
        url: https://github.com/shayangerami/EvidenceEvalRAG
        summary: Independent project
        highlights:
          - Built a LangGraph agent with local Qwen models, semantic retrieval, evidence verification, conditional retries,
            and abstention. Evaluated 300 SciFact claims, reducing the automated unsupported-answer metric from 37.7% to 7.3%
            while tracking answer coverage and latency.

      - name: Deep Domain Adaptation for CT-to-X-Ray Classification
        date: 2025-12
        url: https://github.com/shayangerami/DomainAdaptation
        summary: Independent project
        highlights:
          - Compared fine-tuning, DANN, CORAL, and MMD using a RadImageNet-pretrained ResNet-50, improving target X-ray test accuracy
            from 60.87% to 97.83% in the best configuration.

      - name: Multi-Branch Feature Fusion for Traffic Sign Recognition
        date: 2025-12
        url: https://github.com/shayangerami/Multi-Branch-GTSRB
        summary: Independent project
        highlights:
          - Combined frozen edge, shape, and color backbones through feature-level fusion, achieving 86% GTSRB accuracy with
            1.2M trainable parameters and 16.8M frozen parameters.

